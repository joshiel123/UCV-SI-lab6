[project]
name = "ucv-si-lab6"
version = "0.1.0"
description = "Laboratorio 6 - Sistemas Inteligentes"
authors = [
    {name = "Joshi", email = "jalfagemene@ucvvirtual.edu.pe"}
]
# Restringimos el límite superior para que pgmpy sea feliz
requires-python = ">=3.11,<3.14.1 || >3.14.1,<3.15"
dependencies = [
    "networkx (>=3.6.1,<4.0.0)",
    "matplotlib (>=3.10.9,<4.0.0)",
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn (>=0.47.0,<0.48.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pgmpy (>=1.1.2,<2.0.0)",
    "python-multipart (>=0.0.28,<0.0.29)"
]

[tool.poetry]
# Esto le dice a Poetry que es un proyecto/aplicación, no una librería distribuible
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)"
]
